baseURL = 'https://lucidvagary.com/'
title = "lucid vagary"
theme = "mana"
languageCode = "en-us"
defaultContentLanguage = "en"

[pagination]
  pageSize = 10

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "catppuccin-macchiato"

[outputs]
  home = ["HTML", "JSON"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  enableIntegrity = false
  relatedPostsCount = 3
  description = "These fragments of my mind about a little thing here and there pulled together for your...well, you'll figure it out."
  author = "Sean"
  heroTitleLine1 = "lucid vagary"
  heroTitleLine2 = "whims, clearly seen"
  footerText = "lucid vagary"

  [params.avatar]
    url = "/images/hero-tower.jpg"

  [params.buyMeACoffee]
    enabled = false

  [params.codeHighlight]
    darkTheme = "catppuccin-macchiato"
    lightTheme = "catppuccin-frappe"

  [params.copyright]
    startYear = 2026
    owner = "Sean"

  [params.admonitions]
    alertStyle = "favicon"

[[menus.main]]
  name = "home"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "posts"
  pageRef = "/posts"
  weight = 20

[[menus.main]]
  name = "tags"
  pageRef = "/tags"
  weight = 30

[[menus.main]]
  name = "about"
  url = "/about/"
  weight = 40
